<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerías de arte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Catálogo de galería</h1>

    <div class="form">
        <h2>Registrar Nueva Galería</h2>
        <input type="number" id="ID" placeholder="ID (Identificador único)" />
        <input type="text" id="nombre" placeholder="Nombre de la galería" />
        <input type="text" id="ubicacion" placeholder="Ubicación principal" />
        <input type="text" id="especialidad" placeholder="Especialidad / Enfoque" />   
        <input type="url" id="imagen" placeholder="URL de la imagen / logo" />
        <button id="agregar">Agregar Galería</button>
    </div>
